name: Release

# builds a Windows installer and attaches it to a GitHub Release. runs on
# pushing a version tag (e.g. "v1.2.0"), or manually via workflow_dispatch
# for test runs.
#
# only x64 is built - Flutter doesn't publish a native ARM64 Windows SDK to
# cross-compile a genuinely separate ARM64 binary from (confirmed via its
# releases_windows.json manifest, which only ever lists an x64 dart_sdk_arch).
# this x64 build already runs fine on ARM64 Windows through the OS's built-in
# x64 emulation, so there's no real benefit to a second "arm64" build that
# would just be the same x64 bytes under a different label.
# 32-bit x86 isn't offered because Flutter's Windows engine was never built
# for it - there is no such target to produce.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "OSCSlider-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OSCSlider-portable
          path: OSCSlider-portable.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\oscslider.iss

      - uses: actions/upload-artifact@v4
        with:
          name: OSCSlider-Setup
          path: installer/Output/OSCSlider-Setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload installer + portable zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
